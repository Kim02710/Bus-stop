     @keyframes loading-bounce {
  0%, 80%, 100% {

  } 40% {

  }
}

.intro-content {
    animation: fadeInUp 0.8s ease-out;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes rainDrop {
    0% {
        top: -10px;
        opacity: 1;
    }
    100% {
        top: 100vh;
        opacity: 0.3;
    }
}

.rain-drop {
    position: absolute;
    width: 2px;
    height: 20px;
    background: linear-gradient(transparent, rgba(255,255,255,0.4), transparent);
    animation: rainDrop linear infinite;
    border-radius: 50%;
}

    left: 50%;

    z-index: 100;

#destination-menu h3 {
    margin-top: 0;
    text-align: center;
}

.destination-option {
    display: block;
    width: 100%;
    padding: 10px;

    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}


#close-menu {
    background: rgb(215, 63, 63);
    margin-top: 10px;
}



.instructions-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

.instructions-btn {
    background: rgba(0, 0, 0, 0.5);

    font-size: 16px;

.instructions-dropdown {
    position: absolute;
    top: 100%;
    right: 0;

    color: white;
    border-radius: 10px;
    padding: 20px;
    min-width: 300px;

    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    margin-top: 10px;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.instructions-dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.instructions-dropdown div {
    margin-bottom: 10px; 
    margin-top: 10px;
}

.instruction-key {
    background: #333;
    color: #82cfff;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: monospace;
    margin-right: 8px;
    margin-top: 10px;
}

/* Intro container */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 2s ease-in-out;
            z-index: 9999;
            color: white;
        }
        
        /* Intro content */
        #intro-content {
            text-align: center;
            opacity: 0;
            animation: fadeInUp 2s ease-out forwards;
        }
        
        #intro-content h1 {
            font-size: 3.5em;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            background-color: #ffffff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #intro-content p {
            font-size: 1.2em;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0 auto 30px auto;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.6;
            text-align: center;
        }
        
        /* Loading*/
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .loading-dots span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ffffff;
            margin: 0 4px;
            animation: loading-bounce 1.4s ease-in-out infinite both;
        }
        
        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        
        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        
        .loading-text {
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            text-align: center;
        }
        
        /* Rain effect*/
        #intro-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .rain-drop {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.6));
            height: 20px;
            border-radius: 0 0 5px 5px;

  <script>
AFRAME.registerComponent('animation-move', {
  schema: {
    path: {
      default: [],
      parse: function (value) {
        return JSON.parse(value);
      }
    },
    animationStepTime: {
      type: 'int',
      default: 0
    }
  },
  init: function(){
    this.next = 0;
    this.stopped = false;
    let object = this.el;
    for (let prop in this.data.path[this.next]) {
      object.setAttribute( prop, this.data.path[this.next][prop] );
    }
  },
  tick: function (time, timeDelta) {
    if (this.stopped || this.next >= this.data.path.length) {
      return;
    }

    let updated = false;
    let delta = this.data.animationStepTime / (16.7 * ((this.data.animationStepTime+timeDelta)/this.data.animationStepTime));
    let object = this.el;

    for (let prop in this.data.path[this.next]) {
      let attr = object.getAttribute(prop);
      let nextStep = this.data.path[this.next][prop];

      let prevStep = (this.next-1 >= 0) ? this.data.path[this.next-1][prop] : this.data.path[this.data.path.length-1][prop];
      let xDelta = Math.abs(nextStep.x - prevStep.x)/delta;
      let yDelta = Math.abs(nextStep.y - prevStep.y)/delta;
      let zDelta = Math.abs(nextStep.z - prevStep.z)/delta;

      // X
      if (attr.x != nextStep.x) {
        if (nextStep.x < prevStep.x) {
          if (attr.x-xDelta < nextStep.x) attr.x = nextStep.x;
          else { attr.x -= xDelta; updated = true; }
        } else if (nextStep.x > prevStep.x) {
          if (attr.x+xDelta > nextStep.x) attr.x = nextStep.x;
          else { attr.x += xDelta; updated = true; }
        } else {
          attr.x = nextStep.x;
        }
      }
      // Y
      if (attr.y != nextStep.y) {
        if (nextStep.y < prevStep.y) {
          if (attr.y-yDelta < nextStep.y) attr.y = nextStep.y;
          else { attr.y -= yDelta; updated = true; }
        } else if (nextStep.y > prevStep.y) {
          if (attr.y+yDelta > nextStep.y) attr.y = nextStep.y;
          else { attr.y += yDelta; updated = true; }
        } else {
          attr.y = nextStep.y;
        }
      }
      // Z
      if (attr.z != nextStep.z) {
        if (nextStep.z < prevStep.z) {
          if (attr.z-zDelta < nextStep.z) attr.z = nextStep.z;
          else { attr.z -= zDelta; updated = true; }
        } else if (nextStep.z > prevStep.z) {
          if (attr.z+zDelta > nextStep.z) attr.z = nextStep.z;
          else { attr.z += zDelta; updated = true; }
        } else {
          attr.z = nextStep.z;
        }
      }

      object.setAttribute( prop, attr.x+' '+attr.y+' '+attr.z );
    }
    if (!updated) {
      this.next++;
      if (this.next >= this.data.path.length) {
        this.stopped = true;
      }
    }
  }
});
</script>

          <script>
//animated rain effect for intro
function createRainDrop() {
    const rainContainer = document.getElementById('intro-rain');
    if (!rainContainer) return;
    
    const drop = document.createElement('div');
    drop.className = 'rain-drop';
    drop.style.left = Math.random() * 100 + '%';
    drop.style.animationDuration = (Math.random() * 2 + 1) + 's';
    drop.style.opacity = Math.random() * 0.5 + 0.3;
    
    rainContainer.appendChild(drop);
    
    // Remove drop after animation
    setTimeout(() => {
        if (drop.parentNode) {
            drop.parentNode.removeChild(drop);
        }
    }, 3000);
}

// Start rain effect
const rainInterval = setInterval(createRainDrop, 100);

// Hide intro after loading
setTimeout(function() {
    const intro = document.getElementById('intro');
    intro.style.transform = 'translateY(-100vh)';
    intro.style.opacity = '0';
    
    // Stop rain effect
    clearInterval(rainInterval);
    
    // Remove intro element completely after transition
    setTimeout(() => {
        intro.style.display = 'none';
    }, 2000);
}, 5000);


const scene = AFRAME.scenes[0];
scene.systems.physics.driver.world.gravity.y = -2;

var targetEl = document.querySelector('#bus-schedule');
var bus = document.querySelector('#miubus');

targetEl.addEventListener('click', function() {
    bus.setAttribute('animation', 'loop: false');
    bus.setAttribute('animation-move', 'path: [{"position": {"x": -11.39768, "y": 0.87467, "z": 0.1}, "rotation": {"x": 0, "y": 0, "z":0}}, {"position": {"x": 0.108, "y": 0.87467, "z": 0.1}, "rotation": {"x": 0, "y": 0, "z": 0}}]; animationStepTime: 3000;');
});

bus.addEventListener('click', function() {
    document.getElementById('destination-menu').style.display = 'block';
});

function goToDestination(filename) {
    window.location.href = filename;
}

function closeDestinationMenu() {
    document.getElementById('destination-menu').style.display = 'none';
}

function playrain() {
  var bgm = document.getElementById('rain');
  bgm.volume = 1.0;
  rain.loop = true;
  bgm.play();
}
var walk = document.getElementById('walk');

document.addEventListener("keydown", (event) => {
      if (event.key === "w" || event.key === "W") {
        walk.loop = true;
        walk.play();
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "w" || event.key === "W") {
        walk.pause();
        walk.currentTime = 0;
      }
    });

    //Instructions Drop Down
    function toggleInstructions() {
    document.getElementById('instructionsDropdown').classList.toggle('show');
}
</script>
